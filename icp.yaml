canisters:
  - name: backend
    recipe:
      type: "@dfinity/motoko@v5.0.0"
  - name: frontend
    recipe:
      type: "@dfinity/static-site@v0.4.0"
      configuration:
        dir: dist
        build:
          - npm ci
          - npm run generate
          - npm run build
networks:
  - name: local
    mode: managed
    gateway:
      port: 8001
