[toolchain]
moc = "1.15.1"

[moc]
args = [ "--default-persistent-actors", "-W=M0223,M0236,M0237" ]

[canisters.backend]
main = "src/main.mo"
candid = "src/backend.did"

[canisters.backend.migrations]
chain = "src/migrations"
check-limit = 1

[canisters.backend.check-stable]
path = "deployed/backend.most"

[dependencies]
core = "2.6.1"
